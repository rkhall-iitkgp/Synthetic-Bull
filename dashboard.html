<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyntheticBull Exchange</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --buy-color: #22c55e;
            --buy-color-bg: rgba(34, 197, 94, 0.15);
            --sell-color: #ef4444;
            --sell-color-bg: rgba(239, 68, 68, 0.15);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            background: radial-gradient(circle at top right, #1e293b, var(--bg-dark));
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        /* ── Header ── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            z-index: 10;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;}
        .logo span { color: var(--accent); }
        .user-info { display: flex; gap: 16px; align-items: center; color: var(--text-muted); font-size: 13px; }
        .ping-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--buy-color); box-shadow: 0 0 10px var(--buy-color); }

        /* ── Layout Grid ── */
        .layout {
            display: grid;
            grid-template-columns: 240px 1fr 300px;
            grid-template-rows: 1fr;
            flex: 1;
            overflow: hidden;
            gap: 12px;
            padding: 12px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
        }

        /* ── Sidebar (Symbols) ── */
        .symbol-list { overflow-y: auto; flex: 1; }
        .symbol-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            transition: all 0.2s ease;
        }
        .symbol-item:hover { background: rgba(255,255,255,0.03); }
        .symbol-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent);
        }
        .sym-name { font-weight: 600; }
        .sym-price { font-family: 'JetBrains Mono', monospace; font-size: 13px;}

        /* ── Main Chart Area ── */
        .center-col { display: flex; flex-direction: column; gap: 12px; }
        .chart-panel { flex: 1; position: relative; }
        #chart-container { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; }
        
        .order-entry {
            height: 180px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px;
        }
        .oe-side { display: flex; flex-direction: column; gap: 12px; }
        .oe-row { display: flex; justify-content: space-between; align-items: center; }
        input, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            width: 140px;
            font-family: inherit;
        }
        input:focus, select:focus { border-color: var(--accent); }
        button {
            padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            color: white;
        }
        button:hover { filter: brightness(1.2); }
        button:active { transform: scale(0.98); }
        .btn-buy { background: var(--buy-color); }
        .btn-sell { background: var(--sell-color); }
        
        /* ── Right Column (Orderbook & Portfolio) ── */
        .right-col { display: flex; flex-direction: column; gap: 12px; }
        .orderbook-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .ob-table { display: flex; flex-direction: column; flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; overflow: hidden; }
        .ob-header, .ob-row { display: flex; justify-content: space-between; padding: 4px 16px; }
        .ob-header { color: var(--text-muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--panel-border); margin-bottom: 4px; }
        .ob-asks .ob-row { color: var(--sell-color); }
        .ob-bids .ob-row { color: var(--buy-color); }
        .ob-mid {
            text-align: center; font-size: 18px; font-weight: 700; padding: 8px 0; margin: 4px 0;
            background: rgba(255,255,255,0.02); border-top: 1px solid var(--panel-border); border-bottom: 1px solid var(--panel-border);
        }
        .ob-list { flex: 1; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .ob-list.bids { justify-content: flex-start; }
        .qty-bar { position: relative; z-index: 1;}
        .qty-bar::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; z-index: -1;
            opacity: 0.15;
        }
        .ob-asks .ob-row .qty-bar::before { background: var(--sell-color); }
        .ob-bids .ob-row .qty-bar::before { background: var(--buy-color); }

        .portfolio-panel { height: 280px; overflow-y: auto; }
        .pf-stats { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-bottom: 1px solid var(--panel-border); }
        .pf-stat { display: flex; flex-direction: column; gap: 4px; }
        .pf-val { font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .pf-positions { padding: 8px 16px; display: flex; flex-direction: column; gap: 8px;}
        .pf-pos { display: flex; justify-content: space-between; font-size: 13px; font-family: 'JetBrains Mono', monospace;}

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<header>
    <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M12 2L2 22h20L12 2z"/></svg>
        Synthetic<span>Bull</span>
    </div>
    <div class="user-info">
        <span class="ping-dot" id="pingDot"></span>
        <span id="pingText">Ping: -- ms</span>
        <span id="userIdBox" style="background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 12px;">Waiting...</span>
    </div>
</header>

<div class="layout">
    <!-- Symbols -->
    <div class="panel">
        <div class="panel-header">Markets</div>
        <div class="symbol-list" id="symbolList">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Center -->
    <div class="center-col">
        <!-- Chart -->
        <div class="panel chart-panel">
            <div class="panel-header">
                <span id="chartTitle">Select a market</span>
            </div>
            <div id="chart-container"></div>
        </div>
        
        <!-- Order Entry -->
        <div class="panel order-entry">
            <!-- BUY SIDE -->
            <div class="oe-side">
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Type</span>
                    <select id="buyType" onchange="togglePrice('buy')">
                        <option value="limit">Limit</option>
                        <option value="market">Market</option>
                    </select>
                </div>
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Price</span>
                    <input type="number" id="buyPrice" placeholder="0.00" step="0.01">
                </div>
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Amount</span>
                    <input type="number" id="buyQty" placeholder="0.00" step="0.01">
                </div>
                <button class="btn-buy" onclick="placeOrder('buy')">Buy</button>
            </div>

            <!-- SELL SIDE -->
            <div class="oe-side">
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Type</span>
                    <select id="sellType" onchange="togglePrice('sell')">
                        <option value="limit">Limit</option>
                        <option value="market">Market</option>
                    </select>
                </div>
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Price</span>
                    <input type="number" id="sellPrice" placeholder="0.00" step="0.01">
                </div>
                <div class="oe-row">
                    <span style="color:var(--text-muted)">Amount</span>
                    <input type="number" id="sellQty" placeholder="0.00" step="0.01">
                </div>
                <button class="btn-sell" onclick="placeOrder('sell')">Sell</button>
            </div>
        </div>
    </div>

    <!-- Right Col -->
    <div class="right-col">
        <div class="panel orderbook-panel">
            <div class="panel-header">Order Book <span id="obSpread" style="color:var(--text-muted);font-weight:normal;"></span></div>
            <div class="ob-table">
                <div class="ob-header"><span>Price</span><span>Amount</span></div>
                <div class="ob-list ob-asks" id="obAsks"></div>
                <div class="ob-mid" id="obMid">---</div>
                <div class="ob-list ob-bids" id="obBids"></div>
            </div>
        </div>

        <div class="panel portfolio-panel">
            <div class="panel-header">Portfolio</div>
            <div class="pf-stats">
                <div class="pf-stat">
                    <span style="color:var(--text-muted);font-size:11px;">Total Value</span>
                    <span class="pf-val" id="pfTotal">$0.00</span>
                </div>
                <div class="pf-stat">
                    <span style="color:var(--text-muted);font-size:11px;">Cash Balance</span>
                    <span class="pf-val" id="pfCash">$0.00</span>
                </div>
                <div class="pf-stat">
                    <span style="color:var(--text-muted);font-size:11px;">Realized PnL</span>
                    <span class="pf-val" id="pfRealized">$0.00</span>
                </div>
                <div class="pf-stat">
                    <span style="color:var(--text-muted);font-size:11px;">Unrealized PnL</span>
                    <span class="pf-val" id="pfUnrealized">$0.00</span>
                </div>
            </div>
            <div style="color:var(--text-muted);font-size:11px;padding:8px 16px 0;">Open Positions</div>
            <div class="pf-positions" id="pfPositions">
                <div style="color:var(--text-muted);text-align:center;padding:10px;">No positions yet</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ─── State ───
    let ws;
    let activeSymbol = "AAPL";
    let candlesConfig = {};    // { AAPL: Map<time, candle> }
    let symbolPrices = {};     // { AAPL: lastPrice }
    
    // ─── Chart Initialization ───
    let chart, candleSeries;
    try {
        chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            layout: {
                background: { type: 'solid', color: 'transparent' },
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: 'rgba(255, 255, 255, 0.05)' },
                horzLines: { color: 'rgba(255, 255, 255, 0.05)' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: 'rgba(255, 255, 255, 0.1)',
            },
            timeScale: {
                borderColor: 'rgba(255, 255, 255, 0.1)',
                timeVisible: true,
                secondsVisible: true,
            },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: false,
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444'
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if(chart) chart.applyOptions({ width: document.getElementById('chart-container').clientWidth, height: document.getElementById('chart-container').clientHeight });
        });
    } catch(e) {
        console.error("Chart load failed:", e);
        document.getElementById('chart-container').innerHTML = "<div style='padding:20px;color:red'>Chart failed to load. Check console for details.</div>";
    }

    // ─── UI Helpers ───
    const fmtUSD = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    const fmtNum = (num, dec=4) => num.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });

    function togglePrice(side) {
        let type = document.getElementById(side + 'Type').value;
        document.getElementById(side + 'Price').disabled = (type === 'market');
        if(type === 'market') document.getElementById(side + 'Price').value = '';
    }

    function switchSymbol(sym) {
        activeSymbol = sym;
        document.getElementById('chartTitle').innerText = sym;
        
        // Update selection UI
        document.querySelectorAll('.symbol-item').forEach(el => {
            if(el.dataset.sym === sym) el.classList.add('active');
            else el.classList.remove('active');
        });

        // Set chart data
        if(candlesConfig[sym] && candleSeries) {
            let data = Array.from(candlesConfig[sym].values()).sort((a,b) => a.time - b.time);
            try { candleSeries.setData(data); } catch(e) { console.error("Chart render error:", e) }
        } else if (candleSeries) {
            try { candleSeries.setData([]); } catch(e) {}
        }

        // Update OE price 
        if(symbolPrices[sym]) {
            document.getElementById('buyPrice').value = symbolPrices[sym];
            document.getElementById('sellPrice').value = symbolPrices[sym];
        }
    }

    function placeOrder(side) {
        let type = document.getElementById(side + 'Type').value;
        let qty = parseFloat(document.getElementById(side + 'Qty').value);
        let price = parseFloat(document.getElementById(side + 'Price').value);
        
        if(!qty) return alert("Enter quantity");
        
        let req = { type: "place_order", symbol: activeSymbol, order_type: type, side: side, qty: qty };
        if (type === 'limit') {
            if(!price) return alert("Enter price for limit order");
            req.price = price;
        }
        
        ws.send(JSON.stringify(req));
        
        // Flash button
        let btn = document.querySelector(`.btn-${side}`);
        let oldBg = btn.style.background;
        btn.style.background = '#fff'; btn.style.color = '#000';
        setTimeout(() => { btn.style.background = oldBg; btn.style.color = '#fff'; }, 200);
    }

    function renderOrderBook(msg) {
        document.getElementById('obMid').innerText = fmtNum(msg.mid, 2);
        document.getElementById('obSpread').innerText = "Spread: " + fmtNum(msg.spread, 2);
        
        // Update active symbol price
        symbolPrices[msg.symbol] = msg.mid;
        let sidebarPrice = document.getElementById('price-' + msg.symbol);
        if(sidebarPrice) sidebarPrice.innerText = fmtNum(msg.mid, 2);

        if(msg.symbol !== activeSymbol) return;

        // Bids & Asks HTML
        let maxQty = Math.max(...msg.bids.map(b=>b[1]), ...msg.asks.map(a=>a[1]), 0.0001);
        
        // Asks (Reverse to show lowest price at bottom near mid)
        let asksHtml = msg.asks.slice().reverse().map(a => {
            let pct = (a[1] / maxQty) * 100;
            return `<div class="ob-row"><span class="qty-bar" style="width:${pct}%"></span><span>${fmtNum(a[0], 2)}</span><span>${fmtNum(a[1])}</span></div>`;
        }).join('');
        
        // Bids (Highest price at top near mid)
        let bidsHtml = msg.bids.map(b => {
            let pct = (b[1] / maxQty) * 100;
            return `<div class="ob-row"><span class="qty-bar" style="width:${pct}%"></span><span>${fmtNum(b[0], 2)}</span><span>${fmtNum(b[1])}</span></div>`;
        }).join('');

        document.getElementById('obAsks').innerHTML = asksHtml;
        document.getElementById('obBids').innerHTML = bidsHtml;
    }

    function renderPortfolio(msg) {
        document.getElementById('pfCash').innerText = fmtUSD(msg.cash);
        document.getElementById('pfTotal').innerText = fmtUSD(msg.total_value);
        
        let upnl = document.getElementById('pfUnrealized');
        upnl.innerText = fmtUSD(msg.unrealized_pnl);
        upnl.style.color = msg.unrealized_pnl >= 0 ? 'var(--buy-color)' : 'var(--sell-color)';
        
        let rpnl = document.getElementById('pfRealized');
        rpnl.innerText = fmtUSD(msg.realized_pnl);
        rpnl.style.color = msg.realized_pnl >= 0 ? 'var(--buy-color)' : 'var(--sell-color)';

        let posHtml = '';
        for(let sym in msg.positions) {
            let p = msg.positions[sym];
            let color = p.unrealized_pnl >= 0 ? 'var(--buy-color)' : 'var(--sell-color)';
            posHtml += `<div class="pf-pos">
                <span style="font-weight:bold; width: 40px;">${sym}</span>
                <span>${fmtNum(p.holdings, 4)} @ ${fmtUSD(p.avg_cost)}</span>
                <span style="color:${color}">${fmtUSD(p.unrealized_pnl)}</span>
            </div>`;
        }
        document.getElementById('pfPositions').innerHTML = posHtml || '<div style="color:var(--text-muted);text-align:center;padding:10px;">No open positions</div>';
    }

    // ─── WebSocket Logic ───
    let pingInterval;
    let lastPing = 0;

    function connect() {
        try {
            ws = new WebSocket("ws://127.0.0.1:9001");
            
            ws.onerror = (e) => {
                console.error("WebSocket Error:", e);
                document.getElementById('pingText').innerText = "WS Error! Check server connection.";
                document.getElementById('pingDot').style.background = "var(--sell-color)";
            };

            ws.onopen = () => {
                console.log("Connected to Engine");
                document.getElementById('pingDot').style.background = "var(--buy-color)";
                pingInterval = setInterval(() => {
                    lastPing = Date.now();
                    ws.send(JSON.stringify({ type: "ping" }));
                }, 5000);
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                
                if (msg.type === "welcome") {
                    document.getElementById('userIdBox').innerText = msg.user_id;
                    
                    // Init sidebar
                    let html = '';
                    msg.symbols.forEach(s => {
                        candlesConfig[s.symbol] = new Map();
                        html += `<div class="symbol-item" data-sym="${s.symbol}" onclick="switchSymbol('${s.symbol}')">
                                    <span class="sym-name">${s.symbol}</span>
                                    <span class="sym-price" id="price-${s.symbol}">${fmtNum(s.price,2)}</span>
                                 </div>`;
                    });
                    document.getElementById('symbolList').innerHTML = html;
                    
                    // Select first
                    if(msg.symbols.length > 0) switchSymbol(msg.symbols[0].symbol);
                }
                else if (msg.type === "orderbook") {
                    renderOrderBook(msg);
                }
                else if (msg.type === "candle") {
                    let t = Math.floor(msg.t / 1000); // lightweight charts wants seconds
                    let c = { time: t, open: msg.o, high: msg.h, low: msg.l, close: msg.c };
                    
                    if (!candlesConfig[msg.symbol]) candlesConfig[msg.symbol] = new Map();
                    
                    candlesConfig[msg.symbol].set(t, c);

                    if (msg.symbol === activeSymbol && candleSeries) {
                        try { candleSeries.update(c); } catch(e) {}
                    }
                }
                else if (msg.type === "portfolio") {
                    renderPortfolio(msg);
                }
                else if (msg.type === "pong") {
                    let latency = Date.now() - lastPing;
                    document.getElementById('pingText').innerText = `Ping: ${latency} ms`;
                }
                else if (msg.type === "error") {
                    alert("Engine Error: " + msg.message);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 2000);
                document.getElementById('pingText').innerText = "Disconnected. Reconnecting...";
            };
        } catch(e) {
            console.error("Connect setup failed:", e);
            setTimeout(connect, 2000);
        }
    }

    connect();

</script>
</body>
</html>
