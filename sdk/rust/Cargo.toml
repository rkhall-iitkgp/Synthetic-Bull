[package]
name = "synthetic-bull-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Synthetic-Bull trading platform"
authors = ["Synthetic-Bull Team"]
keywords = ["trading", "websocket", "bot", "exchange", "sdk"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
url = "2.2"
