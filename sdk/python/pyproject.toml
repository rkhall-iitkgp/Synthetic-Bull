[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-bull-sdk"
version = "0.1.0"
description = "Python SDK for Synthetic-Bull trading platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=15,<16",
]
authors = [
    {name = "Synthetic-Bull Team"}
]
keywords = ["trading", "websocket", "bot", "exchange", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_bull_sdk*"]
