# Synthetic-Bull — Full-stack Docker Compose
version: "3.9"

services:
  # ── Module 1: C++ Matching Engine + GBM Simulator ──
  engine:
    build: ./backend
    container_name: synthetic-bull-engine
    ports:
      - "9001:9001"
    restart: unless-stopped
    networks:
      - bull-net

