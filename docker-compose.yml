# Synthetic-Bull — Full-stack Docker Compose
version: "3.9"

services:
  # ── Module 1: C++ Matching Engine + GBM Simulator ──
  engine:
    build: ./backend
    container_name: synthetic-bull-engine
    ports:
      - "9001:9001"
    restart: unless-stopped
    environment:
      - DB_DIR=/data
    volumes:
      - ./data:/data
    networks:
      - bull-net

  admin_api:
    build: ./backend/admin_api
    container_name: synthetic-bull-admin
    ports:
      - "8000:8000"
    environment:
      - DB_DIR=/data
      - ENGINE_WS_URL=ws://engine:9001
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - bull-net

  # ── Module 2: Trading Bots ──
  alpha_bot:
    build: ./bots
    container_name: synthetic-bull-alpha
    depends_on:
      - engine
      - admin_api
    environment:
      - EXCHANGE_WS_URL=ws://engine:9001
      - ALPHA_BOT_API_KEY=${ALPHA_BOT_API_KEY:-}
      - ALPHA_SYMBOL=${ALPHA_SYMBOL:-BTC}
      - STARTING_EQUITY=${STARTING_EQUITY:-100000.0}
      - PNL_FLOOR=${PNL_FLOOR:-80000.0}
      - ALPHA_BOT_PORT=3001
    ports:
      - "3001:3001"
    command: ["python", "-m", "alpha.main"]
    restart: unless-stopped
    networks:
      - bull-net

  market_maker_bot:
    build: ./bots
    container_name: synthetic-bull-mm
    depends_on:
      - engine
      - admin_api
    environment:
      - EXCHANGE_WS_URL=ws://engine:9001
      - MM_BOT_API_KEY=${MM_BOT_API_KEY:-}
      - MM_SYMBOL=${MM_SYMBOL:-AAPL}
      - STARTING_EQUITY=${STARTING_EQUITY:-100000.0}
      - PNL_FLOOR=${PNL_FLOOR:-80000.0}
      - MM_BOT_PORT=3002
    ports:
      - "3002:3002"
    command: ["python", "-m", "market_maker.main"]
    restart: unless-stopped
    networks:
      - bull-net

  custom_bot:
    build: ./bots
    container_name: synthetic-bull-custom
    depends_on:
      - engine
      - admin_api
    environment:
      - EXCHANGE_WS_URL=ws://engine:9001
      - CUSTOM_BOT_API_KEY=${CUSTOM_BOT_API_KEY:-}
      - CUSTOM_SYMBOL=${CUSTOM_SYMBOL:-ETH}
      - STARTING_EQUITY=${STARTING_EQUITY:-100000.0}
      - PNL_FLOOR=${PNL_FLOOR:-80000.0}
      - CUSTOM_BOT_PORT=3003
    ports:
      - "3003:3003"
    command: ["python", "-m", "custom.main"]
    restart: unless-stopped
    networks:
      - bull-net

  # ── Module 3: React Frontend (placeholder — uncomment when ready) ──
  # frontend:
  #   build: ./frontend
  #   container_name: synthetic-bull-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - engine
  #   environment:
  #     - REACT_APP_WS_URL=ws://engine:9001
  #   restart: unless-stopped
  #   networks:
  #     - bull-net

networks:
  bull-net:
    driver: bridge
